name: veilo

# Why CI rather than the Codespace for chain work:
#   * the repo is public, so Actions minutes are unlimited and free
#   * Codespaces auto-sleep and burn the personal quota (~30h/month)
#   * Actions logs are readable from the CLI, so a failing run needs no screenshots
#   * a regtest run here is reproducible: anyone can re-trigger it and get the same
#     ciphertexts, which is a stronger demo artefact than a one-off local run
#
# The Codespace remains useful for interactive development. This workflow is the
# authority on whether anything actually works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mine_blocks:
        description: "Blocks to mine on regtest (coinbase matures at 101)"
        required: false
        default: "110"
      skip_zebra:
        description: "Skip the zebrad regtest job (crypto tests only)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 0. Auto-format. `cargo fmt --check` gates the rust job below, but rustfmt
  #    cannot be run locally on this machine: Smart App Control blocks the binary
  #    rustup downloads (os error 4551). So CI formats and commits instead.
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Manual only. When this ran on every push it checked out a different SHA than
    # the other jobs (ref: main resolved elsewhere), so it reported "nothing to
    # commit" while cargo fmt --check in the rust job failed on the same tree.
    # Running it on demand, then letting the push it makes trigger the normal
    # checks, converges without a race.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: cargo fmt"
          # Single-quoted: YAML rejects backslash escapes in double-quoted scalars.
          file_pattern: 'crates/.*\.rs'

  # ---------------------------------------------------------------------------
  # 1. TypeScript: bid construction, ZIP-321, auction math, vector generation
  # ---------------------------------------------------------------------------
  ts:
    name: typescript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: typecheck
        run: npx tsc --noEmit

      - name: generate cross-implementation vectors
        run: |
          node --experimental-strip-types test/gen-vectors.mjs
          node --experimental-strip-types test/gen-auction-vectors.mjs

      - name: test
        run: node --experimental-strip-types --test "test/*.test.js"

      - name: upload vectors
        uses: actions/upload-artifact@v4
        with:
          name: cross-implementation-vectors
          path: |
            test/vectors.txt
            test/auction-vectors.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Rust: veilo-core + replaying the vectors produced by the TS job
  # ---------------------------------------------------------------------------
  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # --all matters: the root Cargo.toml is a virtual workspace, so without it
      # cargo fmt does not reach the member crates.
      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      # The vectors are generated by the TypeScript implementation. Without them
      # the replay tests would silently have nothing to compare against.
      - name: download vectors from the ts job
        uses: actions/download-artifact@v4
        with:
          name: cross-implementation-vectors
          path: test/

      - name: sanity-check vectors are present
        run: |
          test -s test/vectors.txt       || { echo "::error::test/vectors.txt missing or empty"; exit 1; }
          test -s test/auction-vectors.txt || { echo "::error::test/auction-vectors.txt missing or empty"; exit 1; }
          echo "vectors: $(grep -c '^case_' test/vectors.txt) envelope, $(grep -c '^scenario=' test/auction-vectors.txt) auction"

      - name: test
        run: cargo test --all --verbose

  # ---------------------------------------------------------------------------
  # 3. The browser auditor target: veilo-core -> wasm32-unknown-unknown
  # ---------------------------------------------------------------------------
  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # veilo-wasm is still a stub, so this only proves the target links. It is
      # here to catch the moment the SAPLING auditor is added and something in the
      # dependency graph stops building for wasm32.
      - name: build wasm target
        run: cargo build -p veilo-wasm --target wasm32-unknown-unknown --release

      - uses: actions/upload-artifact@v4
        with:
          name: veilo-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. Config validator — catches unknown-field rejections locally in ms
  # ---------------------------------------------------------------------------
  config:
    name: regtest-config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: validate ops/zebrad-regtest.toml
        run: node ops/validate-config.mjs

  # ---------------------------------------------------------------------------
  # 5. The one that needs a real Zcash node: regtest, end to end
  # ---------------------------------------------------------------------------
  regtest:
    name: regtest
    needs: [config]
    if: ${{ !inputs.skip_zebra && (github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # NOTE: deliberately no job-level `env:` block here. zebrad treats any
    # ZEBRA_* environment variable as a config key, so exporting ZEBRA_REV for
    # the whole job made zebrad parse a top-level `rev` field and abort with
    # "unknown field `rev`". Keep zebra-specific variables scoped to the step
    # that needs them.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cache the built zebrad binary only. Swatinem/rust-cache is deliberately NOT
      # used here: it runs before zebra-src exists, so it keys off this repo's own
      # Cargo.lock and caches veilo artifacts under the name "zebra" -- which never
      # restored anything and made every run pay the ~11.5 minute cold build.
      - name: restore cached zebrad
        id: zebrad-cache
        uses: actions/cache@v4
        with:
          path: bin/zebrad
          key: zebrad-c1f84f3ee92a577ebaeaf5753a5f3cf261428e8e-${{ runner.os }}

      - name: build zebrad with internal-miner
        if: steps.zebrad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ZEBRA_REV=c1f84f3ee92a577ebaeaf5753a5f3cf261428e8e
          # Pinned to a commit SHA. `--rev main` fails with
          #   "revspec 'main' not found; class=Reference (4); code=NotFound (-3)"
          # even though the branch exists, and a SHA also makes this build
          # reproducible instead of tracking whatever main happens to be.
          #
          # The prebuilt release is NOT built with the experimental
          # `internal-miner` feature. In zebra-rpc/src/config/mining.rs,
          # `is_internal_miner_enabled` is #[cfg(feature = "internal-miner")], so
          # without it the method does not exist and `internal_miner = true` is
          # silently inert. Build from source instead.
          #
          # Clone and build in-tree rather than `cargo install --git`:
          #   * cargo install does NOT accept `-p` ("unexpected argument '-p' found")
          #   * without `-p` it reports "multiple packages with binaries found:
          #     zebra-fuzz-targets, zebra-utils, zebrad", because --git searches the
          #     whole workspace for any Cargo.toml
          # `cargo build -p` does accept it, so building from a clone avoids the
          # whole class of problem.
          echo "Building zebrad ${ZEBRA_REV} with --features internal-miner (cold build, be patient)"
          git clone --quiet https://github.com/ZcashFoundation/zebra zebra-src
          git -C zebra-src checkout --quiet "$ZEBRA_REV"
          pushd zebra-src
          cargo build --release --locked \
            -p zebrad --bin zebrad \
            --no-default-features \
            --features internal-miner,release_max_level_info
          popd
          mkdir -p bin
          cp zebra-src/target/release/zebrad bin/zebrad

      - name: verify zebrad can mine
        run: |
          set -euo pipefail
          # Clear any ZEBRA_* vars so they cannot be parsed as config keys.
          unset $(env | grep -oE '^ZEBRA_[A-Z0-9_]+' || true)
          chmod +x bin/zebrad
          ./bin/zebrad --version
          # Prove the feature is actually present rather than trusting the build.
          if ./bin/zebrad --help 2>&1 | grep -qi "internal.miner"; then
            echo "internal-miner: present"
          else
            echo "::warning::could not confirm internal-miner in --help; will verify at runtime"
          fi

      - name: node deps
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      - name: fund the regtest chain
        run: |
          set -uo pipefail
          bash ops/fund.sh 2>&1 | tee ops/fund.log
          echo "--- zebrad log tail ---"
          tail -40 ops/zebrad.log 2>/dev/null || true
          echo "--- chain state ---"
          # Same cookie auth as ops/fund.sh, otherwise this reports 0 even on success.
          AUTH=()
          if [ -s "$HOME/.cache/zebra/.cookie" ]; then
            AUTH=(-u "cookie:$(cat "$HOME/.cache/zebra/.cookie")")
          fi
          curl -s --max-time 10 "${AUTH[@]}" http://127.0.0.1:8232 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' || true
          echo
          H=$(curl -s --max-time 10 "${AUTH[@]}" http://127.0.0.1:8232 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("result",0))' 2>/dev/null || echo 0)
          echo "height=$H"
          if [ "$H" -lt 101 ]; then
            echo "::error::regtest chain only reached height $H; coinbase needs >100"
            exit 1
          fi

      - name: upload regtest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regtest-logs
          path: |
            ops/zebrad.log
            ops/fund.log
            ops/build-zebra.log
          if-no-files-found: ignore

      - name: zebrad process
        if: always()
        run: pkill -f zebrad || true
