name: veilo

# Why CI rather than the Codespace for chain work:
#   * the repo is public, so Actions minutes are unlimited and free
#   * Codespaces auto-sleep and burn the personal quota (~30h/month)
#   * Actions logs are readable from the CLI, so a failing run needs no screenshots
#   * a regtest run here is reproducible: anyone can re-trigger it and get the same
#     ciphertexts, which is a stronger demo artefact than a one-off local run
#
# The Codespace remains useful for interactive development. This workflow is the
# authority on whether anything actually works.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mine_blocks:
        description: "Blocks to mine on regtest (coinbase matures at 101)"
        required: false
        default: "110"
      skip_zebra:
        description: "Skip the zebrad regtest job (crypto tests only)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 0. Auto-format. `cargo fmt --check` gates the rust job below, but rustfmt
  #    cannot be run locally on this machine: Smart App Control blocks the binary
  #    rustup downloads (os error 4551). So CI formats and commits instead.
  # ---------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Manual only. When this ran on every push it checked out a different SHA than
    # the other jobs (ref: main resolved elsewhere), so it reported "nothing to
    # commit" while cargo fmt --check in the rust job failed on the same tree.
    # Running it on demand, then letting the push it makes trigger the normal
    # checks, converges without a race.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: cargo fmt"
          # Single-quoted: YAML rejects backslash escapes in double-quoted scalars.
          file_pattern: 'crates/.*\.rs'

  # ---------------------------------------------------------------------------
  # 1. TypeScript: bid construction, ZIP-321, auction math, vector generation
  # ---------------------------------------------------------------------------
  ts:
    name: typescript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --no-audit --no-fund

      - name: typecheck
        run: npx tsc --noEmit

      # The bid page imports a committed esbuild bundle, the same policy as the
      # committed wasm in demo/pkg. This is the check that makes the policy
      # safe: edit memo.ts, forget to rebuild, and the page would ship sealing
      # code that no longer matches the audited reference.
      - name: the committed bid bundle matches its source
        run: npm run bid:check

      - name: generate cross-implementation vectors
        run: |
          node --experimental-strip-types test/gen-vectors.mjs
          node --experimental-strip-types test/gen-auction-vectors.mjs

      - name: test
        run: node --experimental-strip-types --test "test/*.test.js"

      - name: upload vectors
        uses: actions/upload-artifact@v4
        with:
          name: cross-implementation-vectors
          path: |
            test/vectors.txt
            test/auction-vectors.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Rust: veilo-core + replaying the vectors produced by the TS job
  # ---------------------------------------------------------------------------
  rust:
    name: rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # --all matters: the root Cargo.toml is a virtual workspace, so without it
      # cargo fmt does not reach the member crates.
      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      # The vectors are generated by the TypeScript implementation. Without them
      # the replay tests would silently have nothing to compare against.
      - name: download vectors from the ts job
        uses: actions/download-artifact@v4
        with:
          name: cross-implementation-vectors
          path: test/

      - name: sanity-check vectors are present
        run: |
          test -s test/vectors.txt       || { echo "::error::test/vectors.txt missing or empty"; exit 1; }
          test -s test/auction-vectors.txt || { echo "::error::test/auction-vectors.txt missing or empty"; exit 1; }
          echo "vectors: $(grep -c '^case_' test/vectors.txt) envelope, $(grep -c '^scenario=' test/auction-vectors.txt) auction"

      - name: test
        run: cargo test --all --verbose

      # The audit path is behind the `sapling` feature, so `--all` above does NOT
      # build it. Without this step the trial-decryption tests would never run in
      # CI, and the browser auditor could rot unnoticed.
      - name: test the sapling audit path
        run: cargo test -p veilo-core --features sapling --test sapling_audit --verbose

      # The demo fixture must audit to the outcome it claims. demo/index.html
      # renders whatever this pipeline produces, so a silent drift here would
      # mean the demo shows a wrong answer while the page still looks fine.
      - name: test the demo fixture end to end
        run: cargo test -p veilo-core --features sapling --test demo_audit --verbose

      # Everything above starts from ciphertexts this repo produced. This one
      # starts from a transaction zcashd 6.20.0 mined on regtest and committed
      # under demo/chain-probe/, and checks that the auditor -- using only the
      # published viewing key -- recovers the 512-byte envelope from raw bytes.
      - name: audit a transaction a real node mined
        run: cargo test -p veilo-core --features sapling --test chain_probe -- --nocapture

      - name: test the wasm auditor exports
        run: cargo test -p veilo-wasm --features sapling --verbose

      - name: clippy with the sapling feature
        run: cargo clippy --workspace --all-targets --features veilo-core/sapling -- -D warnings

      - name: build the browser auditor
        run: cargo build -p veilo-wasm --features sapling --target wasm32-unknown-unknown

      # Generate the wasm-bindgen bindings the browser actually loads, and check
      # them. `cargo build --target wasm32` alone produces a .wasm no browser can
      # call, so a broken ABI or a JSON contract mismatch between Rust and the
      # page would only surface in a browser. This runs demo/index.html's exact
      # pipeline under Node against the real fixture using the same module.
      - name: build the demo bundle
        run: bash ops/build-wasm.sh
      - name: verify the browser pipeline
        run: bash ops/verify-demo.sh
      - name: upload the demo bundle
        uses: actions/upload-artifact@v4
        with:
          name: veilo-demo-bundle
          path: demo/pkg

  # ---------------------------------------------------------------------------
  # 3. The browser auditor target: veilo-core -> wasm32-unknown-unknown
  # ---------------------------------------------------------------------------
  wasm:
    name: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # veilo-wasm is still a stub, so this only proves the target links. It is
      # here to catch the moment the SAPLING auditor is added and something in the
      # dependency graph stops building for wasm32.
      - name: build wasm target
        run: cargo build -p veilo-wasm --target wasm32-unknown-unknown --release

      - uses: actions/upload-artifact@v4
        with:
          name: veilo-wasm
          path: target/wasm32-unknown-unknown/release/*.wasm
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 4. Config validator — catches unknown-field rejections locally in ms
  # ---------------------------------------------------------------------------
  config:
    name: regtest-config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: validate ops/zebrad-regtest.toml
        run: node ops/validate-config.mjs

  # ---------------------------------------------------------------------------
  # 5. The demo page, in a real browser
  #
  # No amount of Rust coverage can see a blank screen. This opens the page in
  # Chrome and meets it the way a person does: nothing audited yet, a loading
  # state, an error with a retry that works, a visible focus ring, and 375px
  # without a sideways scroll. It also re-runs the audit pipeline against the
  # committed wasm, so a page that renders 60.00 ZEC from a stale bundle fails.
  # ---------------------------------------------------------------------------
  demo:
    name: demo (real browser)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      # Google Chrome is preinstalled on the ubuntu-24.04 runner image, so
      # playwright-core drives that rather than downloading a browser. If the
      # image ever drops Chrome, this fails loudly instead of skipping.
      - name: confirm a browser exists
        run: |
          command -v google-chrome || command -v google-chrome-stable \
            || { echo "::error::no Chrome on this runner"; exit 1; }

      - name: the page's states, in Chrome
        run: npm run demo:states

      - name: the bid page, in Chrome
        run: npm run bid:states

      - name: the audit arithmetic, in Node
        run: npm run demo:audit

  # ---------------------------------------------------------------------------
  # 6. The old regtest path, superseded by the Zallet job below
  #
  # MANUAL DISPATCH ONLY, deliberately. This job cannot pass on this project:
  # it drives zebrad as if it were a wallet, and zebrad has no wallet
  # (`z_getnewaddress`, `z_getbalance` and `z_sendmany` all return -32601).
  #
  # Its header used to add that zebrad's miner "cannot build a regtest block 1
  # (upstream #8434) ... equal activation heights collide in zebra's BTreeMap".
  # The collision is real, the conclusion was not: Canopy must be the survivor
  # at height 1, and Heartwood then resolves to the same height through
  # NetworkUpgrade::activation_height's fallback. The Zallet job below mines
  # block 1 every run, which is the proof. See ops/README.md.
  #
  # It used to run on every push via `!inputs.skip_zebra`, which is TRUE when the
  # input is unset on a push event. Every push therefore went red, which made a
  # green run meaningless. Known-broken exploration should not sit on the merge
  # gate; the Zallet-based regtest job below replaces it.
  # ---------------------------------------------------------------------------
  regtest:
    name: regtest (known broken)
    needs: [config]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_zebra }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # NOTE: deliberately no job-level `env:` block here. zebrad treats any
    # ZEBRA_* environment variable as a config key, so exporting ZEBRA_REV for
    # the whole job made zebrad parse a top-level `rev` field and abort with
    # "unknown field `rev`". Keep zebra-specific variables scoped to the step
    # that needs them.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cache the built zebrad binary only. Swatinem/rust-cache is deliberately NOT
      # used here: it runs before zebra-src exists, so it keys off this repo's own
      # Cargo.lock and caches veilo artifacts under the name "zebra" -- which never
      # restored anything and made every run pay the ~11.5 minute cold build.
      #
      # restore/save are used explicitly rather than actions/cache, because the
      # implicit save only runs when the whole job succeeds. fund.sh fails often
      # enough that this would mean paying the cold build on every real iteration.
      - name: restore cached zebrad
        id: zebrad-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/zebrad
          key: zebrad-indexer-c1f84f3ee92a577ebaeaf5753a5f3cf261428e8e-${{ runner.os }}

      - name: build zebrad with internal-miner
        if: steps.zebrad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ZEBRA_REV=c1f84f3ee92a577ebaeaf5753a5f3cf261428e8e
          # Pinned to a commit SHA. `--rev main` fails with
          #   "revspec 'main' not found; class=Reference (4); code=NotFound (-3)"
          # even though the branch exists, and a SHA also makes this build
          # reproducible instead of tracking whatever main happens to be.
          #
          # The prebuilt release is NOT built with the experimental
          # `internal-miner` feature. In zebra-rpc/src/config/mining.rs,
          # `is_internal_miner_enabled` is #[cfg(feature = "internal-miner")], so
          # without it the method does not exist and `internal_miner = true` is
          # silently inert. Build from source instead.
          #
          # Clone and build in-tree rather than `cargo install --git`:
          #   * cargo install does NOT accept `-p` ("unexpected argument '-p' found")
          #   * without `-p` it reports "multiple packages with binaries found:
          #     zebra-fuzz-targets, zebra-utils, zebrad", because --git searches the
          #     whole workspace for any Cargo.toml
          # `cargo build -p` does accept it, so building from a clone avoids the
          # whole class of problem.
          echo "Building zebrad ${ZEBRA_REV} with --features internal-miner (cold build, be patient)"
          git clone --quiet https://github.com/ZcashFoundation/zebra zebra-src
          git -C zebra-src checkout --quiet "$ZEBRA_REV"
          pushd zebra-src
          cargo build --release --locked \
            -p zebrad --bin zebrad \
            --no-default-features \
            --features internal-miner,release_max_level_info
          popd
          mkdir -p bin
          cp zebra-src/target/release/zebrad bin/zebrad

      - name: save zebrad cache
        if: steps.zebrad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bin/zebrad
          key: zebrad-indexer-c1f84f3ee92a577ebaeaf5753a5f3cf261428e8e-${{ runner.os }}

      - name: verify zebrad can mine
        run: |
          set -euo pipefail
          # Clear any ZEBRA_* vars so they cannot be parsed as config keys.
          unset $(env | grep -oE '^ZEBRA_[A-Z0-9_]+' || true)
          chmod +x bin/zebrad
          ./bin/zebrad --version
          # Prove the feature is actually present rather than trusting the build.
          if ./bin/zebrad --help 2>&1 | grep -qi "internal.miner"; then
            echo "internal-miner: present"
          else
            echo "::warning::could not confirm internal-miner in --help; will verify at runtime"
          fi

      - name: node deps
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund

      - name: fund the regtest chain
        run: |
          set -uo pipefail
          bash ops/fund.sh 2>&1 | tee ops/fund.log
          echo "--- zebrad log tail ---"
          tail -40 ops/zebrad.log 2>/dev/null || true
          echo "--- chain state ---"
          # getblockcount is an INDEXER method (indexer_listen_addr) and needs the
          # auth cookie; the main rpc port 8232 does not serve it at all.
          unset $(env | grep -oE '^ZEBRA_[A-Z0-9_]+' || true)
          AUTH=()
          if [ -s "$HOME/.cache/zebra/.cookie" ]; then
            AUTH=(-u "cookie:$(cat "$HOME/.cache/zebra/.cookie")")
          fi
          curl -s --max-time 10 "${AUTH[@]}" http://127.0.0.1:8233 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' || true
          echo
          H=$(curl -s --max-time 10 "${AUTH[@]}" http://127.0.0.1:8233 \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"getblockcount","params":[]}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("result",0))' 2>/dev/null || echo 0)
          echo "height=$H"
          if [ "$H" -lt 101 ]; then
            echo "::error::regtest chain only reached height $H; coinbase needs >100"
            exit 1
          fi

      - name: upload regtest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regtest-logs
          path: |
            ops/zebrad.log
            ops/fund.log
            ops/build-zebra.log
          if-no-files-found: ignore

      - name: zebrad process
        if: always()
        run: pkill -f zebrad || true

  # ---------------------------------------------------------------------------
  # 7. The real wallet stack: zebrad + Zallet on regtest
  #
  # This replaces the `regtest` job above, which tried to make zebrad do wallet
  # work it cannot do (it has no wallet at all: z_getnewaddress, z_getbalance
  # and z_sendmany all return -32601).
  #
  # Milestone 2 (this job): zebrad and Zallet run together, the node mines block
  # 1, the wallet syncs to it, creates an account and derives a `uregtest1...`
  # Unified Address. Next is funding that address and sending a transaction
  # carrying a real 512-byte Veilo memo, then feeding the resulting
  # encCiphertext to veilo-core's auditor.
  #
  # Runs on every push: unlike the old job this one is expected to be green, and
  # it is the thing that proves the demo's core is real.
  # ---------------------------------------------------------------------------
  zallet:
    name: zallet + zebrad (regtest)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The two binaries are version-locked to each other, and neither "latest"
    # side is the right answer.
    #
    # Zallet's zebra backend opens zebrad's RocksDB directory read-only, so the
    # two must agree on the on-disk format. Zallet v0.1.0-beta.3 pins
    # zebra-state 12 and zebra-rpc 15 (backends/zebra/Cargo.toml). zebra-state
    # 12.0.1 is what zebrad v6.2.3 ships, and that tree declares
    # DATABASE_FORMAT_VERSION = 28 -- the "v28" database Zallet looks for.
    #
    # Newer zebrad writes a newer format (v6.3.0 -> zebra-state 13, v7.0.0 ->
    # 16) and Zallet then refuses to start:
    #   "no zebra-state v28 database found under /tmp/zebra-cache"
    # That is a version pairing, not a defect on either side. When Zallet bumps
    # its zebra-state range, move this commit with it.
    #
    # Pinned by commit rather than tag so a moved tag cannot silently change
    # what CI builds. 7121c82 is v6.2.3.
    #
    # No continue-on-error: this job was red for its whole life until the pairing
    # above was fixed, and it is the only thing in the repository that runs a
    # real Zcash node. If it breaks, that has to be visible in the PR status.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # ---- zebrad ------------------------------------------------------------
      - name: restore cached zebrad
        id: zebrad-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/zebrad
          # `miner` is part of the key because the previous cache holds a build
          # without the internal-miner feature, and that binary cannot mine the
          # block the wallet needs in order to finish its first sync.
          key: zebrad-miner-7121c82ba6795a151523d5b308a19743f4a1ade7-${{ runner.os }}

      - name: build zebrad
        if: steps.zebrad-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          ZEBRA_REV=7121c82ba6795a151523d5b308a19743f4a1ade7  # v6.2.3
          git clone --quiet https://github.com/ZcashFoundation/zebra zebra-src
          git -C zebra-src checkout --quiet "$ZEBRA_REV"
          # --features indexer is REQUIRED by Zallet's default `zebra-state`
          # backend: it speaks the gRPC read-state service, which only exists in
          # a zebrad built with that feature. Without it Zallet refuses to start
          # with "the zebra-state backend requires an
          # [indexer.read_state_service] config section".
          #
          # --features internal-miner adds the `generate` RPC. Zallet cannot
          # finish its first sync at height 0 -- the bootstrap account's birthday
          # is block 0, so there is no block for the scanner to start on and it
          # stays locked forever -- which means one regtest block has to be
          # mined before the wallet will answer account RPCs.
          #
          # Also note that this port speaks gRPC, not JSON-RPC. An earlier
          # version of this project probed it with curl and got
          # "curl: (1) Received HTTP/0.9 when not allowed" -- that was gRPC
          # being fed an HTTP request, not a broken node.
          cargo build --release --locked --manifest-path zebra-src/Cargo.toml             -p zebrad --bin zebrad --no-default-features --features indexer,internal-miner
          mkdir -p bin
          cp zebra-src/target/release/zebrad bin/zebrad
          chmod +x bin/zebrad
          ./bin/zebrad --version

      # restore/ and save/ are split so the cache is only written on a miss.
      # Without this save step the restore above never has anything to find,
      # and every run pays for a full zebrad build (~11 minutes) for nothing.
      - name: save built zebrad
        if: steps.zebrad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: bin/zebrad
          key: zebrad-miner-7121c82ba6795a151523d5b308a19743f4a1ade7-${{ runner.os }}

      # ---- zallet ------------------------------------------------------------
      - name: install zallet
        run: bash ops/install-zallet.sh

      # ---- run the stack -----------------------------------------------------
      - name: start zebrad and zallet, produce an address
        run: bash ops/zallet-smoke.sh

      # Ship the logs. Reading them out of the step output means fighting
      # truncated tails and ANSI escapes; an artifact is the real file.
      - name: upload node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zallet-regtest-logs
          path: |
            ops/zallet.log
            ops/zebrad-zallet.log
          if-no-files-found: warn

      - name: show what we learned
        if: always()
        run: |
          echo "=== zebrad log tail ==="
          tail -25 ops/zebrad-zallet.log 2>/dev/null || echo "(no zebrad log)"
          echo
          echo "=== zallet log tail ==="
          tail -25 ops/zallet.log 2>/dev/null || echo "(no zallet log)"
