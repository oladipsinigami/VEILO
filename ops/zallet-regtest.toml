# Zallet testnet/regtest configuration for Veilo.
#
# Generated from `zallet example-config` and trimmed. Generated by
# `zallet v0.1.0-beta.3`.
#
# THE IMPORTANT PART: `[indexer] validator_address`
# ------------------------------------------------
# Zallet is NOT a standalone wallet. It is a signing/builder that needs a full
# node as its data source -- `zallet.toml` calls it "the full node / validator
# being used as a data source", and warns that `[consensus]` "MUST match the
# configuration of the full node".
#
# So the stack is always zebrad + Zallet. That is fine: it is exactly why regtest
# remains the engineering path, since both halves are obtainable.
#
# Generated for REGTEST. Set network = "testnet" and point validator_address at a
# public testnet node to use the real network instead.

[consensus]
# Must match the full node. For regtest the node is our own zebrad.
network = "regtest"

[database]
# Relative to the Zallet data directory.
wallet = "wallet.db"

[rpc]
# Bound to loopback only. Zallet refuses a remote bind unless explicitly allowed,
# which is the right default for a wallet holding spendable keys.
bind = ["127.0.0.1:28232"]
# Non-loopback RPC needs an explicit opt-in; we never want it here.
allow_insecure_remote_bind = false
# Static credentials so CI can call the wallet without an interactive prompt.
# These are throwaway values for an ephemeral regtest node that holds nothing of
# value. NEVER reuse them on mainnet.
user = "veilo"
password = "veilo-regtest-only"

[indexer]
# The full node Zallet reads chain data from. Port 28233 is zebrad's regtest RPC;
# it must expose the indexer RPC as well, because wallet scanning needs block
# and transaction data, not just the RPC surface.
validator_address = "127.0.0.1:28233"