# Zebra regtest configuration for Veilo.
#
# Why regtest and not public Testnet:
#   * `zebrad` publishes Linux-only binaries (aarch64/x86_64 gnu), so no node can run
#     on the builder's Windows machine at all.
#   * Public Testnet explorer endpoints tested on Oct 12 were unreachable, and
#     lightwalletd only serves ZIP-307 *compact* outputs (52 bytes, no memo), so it
#     cannot supply the full 580-byte encCiphertexts the auditor needs.
#   * Regtest SKIPS Proof-of-Work validation entirely and can activate network
#     upgrades at low heights, so the demo exercises the real target network rules
#     (Ironwood pool, enableCrossAddress = 0) deterministically and offline.
#
# Every key below was fixed against a real zebrad `Configuration error`, not guessed.
# The config is deny_unknown_fields, so ONE wrong key makes the node refuse to start.
# Two mistakes that cost iterations, recorded so they are not repeated:
#   * The dot-release names are `NU6.1`, `NU6.2`, `NU6.3` -- WITH DOTS. Writing
#     `NU6_1` is rejected. Dotted keys must be quoted in TOML.
#   * `enable_zmq` is not a valid [rpc] key in this version. Valid keys are
#     listen_addr, indexer_listen_addr, lightwalletd_listen_addr,
#     parallel_cpu_threads, debug_force_finished_sync, cookie_dir,
#     enable_cookie_auth, max_response_body_size.
# Activation heights are strictly increasing (Zebra validates the order).
# NU6.3 lands at 11 and NU7 at 12.

[network]
network = "Regtest"

[network.testnet_parameters.activation_heights]
BeforeOverwinter = 1
Overwinter = 2
Sapling = 3
Blossom = 4
Heartwood = 5
Canopy = 6
NU5 = 7
"NU6" = 8
"NU6.1" = 9
"NU6.2" = 10
"NU6.3" = 11
NU7 = 12

# Non-persistent chain state. Every restart is a clean chain, which is what a
# deterministic demo wants.
[state]
ephemeral = true

# Needed so send_raw_transaction can mine non-coinbase transactions onto the chain.
[rpc]
listen_addr = "0.0.0.0:8232"

# `internal_miner` belongs INSIDE [mining]. There is no top-level [internal_miner]
# table, and the config is deny_unknown_fields, so an unknown table makes zebrad
# refuse to start.
#
# It is also gated on the cargo feature `internal-miner`: in
# zebra-rpc/src/config/mining.rs, `is_internal_miner_enabled` is
# #[cfg(feature = "internal-miner")], so the method does not exist at all in a build
# without the feature and `internal_miner = true` is silently inert. The prebuilt
# release binaries are NOT built with it -- see ops/build-zebra.sh.
#
# ops/fund.sh overwrites miner_address with one from z_getnewaddress.
[mining]
miner_address = "REPLACE_ME"
internal_miner = true

[metrics]
listen_addr = "127.0.0.1:9990"

[sentry]
enabled = false

[logging]
colour = true
