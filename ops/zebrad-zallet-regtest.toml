# Zebra regtest configuration for Veilo.
#
# Why regtest and not public Testnet:
#   * `zebrad` publishes Linux-only binaries (aarch64/x86_64 gnu), so no node can run
#     on the builder's Windows machine at all.
#   * Public Testnet explorer endpoints tested on Oct 12 were unreachable, and
#     lightwalletd only serves ZIP-307 *compact* outputs (52 bytes, no memo), so it
#     cannot supply the full 580-byte encCiphertexts the auditor needs.
#   * Regtest SKIPS Proof-of-Work validation entirely and can activate network
#     upgrades at low heights, so the demo exercises the real target network rules
#     (Ironwood pool, enableCrossAddress = 0) deterministically and offline.
#
# ---------------------------------------------------------------------------
# Every table and key below was confirmed by real zebrad `Configuration error`
# output. The config is deny_unknown_fields, so ONE wrong name makes the node
# refuse to start. Mistakes made, recorded so they are not repeated:
#   * `NU6.1` / `NU6.2` / `NU6.3` use DOTS. `NU6_1` is rejected. Quoted in TOML.
#   * `enable_zmq` is not a valid [rpc] key.
#   * `sentry` and `logging` are NOT valid top-level tables. The complete set is
#     consensus, metrics, network, state, tracing, sync, mempool, notify, rpc,
#     mining, health, zcashd_compat.
# Activation heights must be strictly increasing and >= 1 (height 0 is Genesis).
# NU6.3 lands at 11, NU7 at 12.
#
# This is deliberately MINIMAL. Anything optional we do not need was removed,
# because every optional key is another chance of an unknown-field rejection.
# Validate before touching the codespace:  node ops/validate-config.mjs
# ---------------------------------------------------------------------------

[network]
network = "Regtest"

[network.testnet_parameters.activation_heights]
# Three upstream constraints on zebra's block-template path all bite at height 1:
#
#  1. The coinbase for block 1 is signed with the v4 sighash, which only exists
#     after Overwinter. With Overwinter above 1, block 1 is a pre-Overwinter
#     block and zebrad aborts with "Signature hashing for pre-overwinter
#     transactions is not supported" (zcash_primitives sighash_v4.rs:255).
#
#  2. Block templates need a chain history root. Zebra only stores one every
#     128 blocks, plus at the Heartwood activation height. Block 1 therefore
#     only has a root if Heartwood activates at height 1, where
#     DefaultRoots::from_coinbase substitutes CHAIN_HISTORY_ACTIVATION_RESERVED.
#     Otherwise zebrad aborts with "history root is required for block templates".
#
#  3. Zebrad refuses to build a template for a block before Canopy:
#     "Zebra does not support generating pre-Canopy block templates". So Canopy
#     has to be active at block 1 as well, which is what makes the miner usable
#     at all on a fresh regtest chain.
#
# Activation heights are a BTreeMap<Height, NetworkUpgrade>, so two upgrades at
# the same height COLLIDE and the later one silently wins. The listed order is
# therefore load-bearing, but the rule is the opposite of the obvious one:
# **Canopy is last among the height-1 entries**. Then
#
#   * the map holds {1: Canopy}, so Canopy.activation_height() is Some(1) and
#     the miner stops refusing templates;
#   * Heartwood is not in the map, so NetworkUpgrade::activation_height falls
#     back to its *next* upgrade (Canopy), which is also 1 -- the history root
#     still works;
#   * Sapling, Blossom and Overwinter resolve to 1 the same way, down the chain.
#
# Putting Heartwood last instead would resolve Canopy to NU5's height and bring
# "pre-Canopy block templates" straight back. The fallback is documented at
# zebra-chain/src/parameters/network_upgrade.rs, activation_height().
#
# Heights only need to be non-decreasing; zebra rejects height < previous.
# NU6.x keys need quoting because a bare NU6.1 is invalid TOML.
Overwinter = 1
Sapling = 1
Blossom = 1
Heartwood = 1
Canopy = 1
NU5 = 3
"NU6" = 4
"NU6.1" = 5
"NU6.2" = 6
"NU6.3" = 7
NU7 = 8

# NOT ephemeral here, unlike ops/zebrad-regtest.toml.
#
# Zallet's zebra-state backend opens this RocksDB directory READ-ONLY as a
# secondary instance so it can follow the chain tip. With `ephemeral = true`
# zebrad keeps its state in a temp directory that is removed on shutdown, so
# there is nothing for Zallet to attach to and startup fails with
# "failed to initialize zallet".
#
# Ephemeral was the right call for the standalone config, where determinism
# mattered and nothing else needed the on-disk state. Here, a real cache_dir is
# a hard requirement of the wallet.
[state]
ephemeral = false
cache_dir = "/tmp/zebra-cache"

# Needed so send_raw_transaction can mine non-coinbase transactions onto the chain.
[rpc]
listen_addr = "127.0.0.1:28233"
# REQUIRED. zebrad serves two different RPC surfaces:
#   * listen_addr          -> wallet/chain methods (z_getnewaddress, z_getbalance, generate)
#   * indexer_listen_addr  -> indexer methods (getblockcount, getblockhash, getbestblockhash)
# Without indexer_listen_addr zebrad logs "configure an indexer_listen_addr to start
# the indexer RPC server" and getblockcount simply does not exist on 8232, so every
# height probe returns "method not found" no matter how it is authenticated.
indexer_listen_addr = "127.0.0.1:28234"

# Cookie auth off. This is an ephemeral regtest node with no peers and no funds;
# there is nothing to protect, and cookie auth makes every client call fail in
# confusing ways (zebrad answers an unauthenticated indexer request with a
# non-HTTP response, which curl reports as "Received HTTP/0.9 when not allowed").
# ops/up.sh and ops/fund.sh still send the cookie when one exists, so turning
# this back on needs no script changes.
enable_cookie_auth = false

# `internal_miner` belongs INSIDE [mining]; there is no top-level [internal_miner]
# table. It is also gated on the cargo feature `internal-miner`: in
# zebra-rpc/src/config/mining.rs, `is_internal_miner_enabled` is
# #[cfg(feature = "internal-miner")], so the method does not exist at all in a build
# without the feature and `internal_miner = true` is silently inert. The prebuilt
# release binaries are NOT built with it -- see ops/build-zebra.sh.
#
# `miner_address` is deliberately ABSENT in this base config, not set to a
# placeholder. It is `Option<ZcashAddress>`, so omitting it is valid and the node
# starts and serves RPC without it -- which is exactly what ops/fund.sh needs, since
# the first legitimate address can only come FROM the running node via
# z_getnewaddress.
#
# A placeholder string does not work: zebrad parses this field eagerly and rejects
# anything that is not a valid Zcash address ("Not a Zcash address for key
# 'mining.miner_address'"). A hand-written tm... string fails the Base58Check
# checksum. There is no valid mainnet-vs-regtest prefix to hand-roll here either,
# so omitting is the only correct starting state.
#
# ops/fund.sh writes the real address in and flips internal_miner to true.
[mining]
internal_miner = false
