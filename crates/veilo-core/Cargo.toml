[package]
name = "veilo-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Veilo memo codec, Vickrey pricing, and seller-exclusion verification"

[dependencies]
# Pinned to the versions on librustzcash `main` so the browser WASM auditor and
# this crate agree byte-for-byte with the TypeScript reference implementation.
blake2 = { version = "0.10", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["alloc", "static_secrets", "precomputed-tables"] }
# The "js" feature supplies randomness in the browser via WebCrypto, which is the
# whole point of shipping the auditor to wasm32-unknown-unknown. Without it,
# getrandom refuses to compile for that target with:
#   "the wasm*-unknown-unknown targets are not supported by default"
getrandom = { version = "0.2", default-features = false, features = ["js"] }

# --- Sapling audit path (Spike A / Phase 2) -------------------------------
# Optional behind the `sapling` feature so the default build stays lean and the
# wasm32 auditor is not forced to pull in the Zcash crypto stack until it is
# actually needed.
#
# NOTE: the Sapling note-encryption API lives in `sapling-crypto`, NOT in
# `zcash_note_encryption`. The latter only provides the generic Domain trait,
# the AEAD, and the byte types. Trial decryption is:
#   sapling_crypto::note_encryption::try_sapling_note_decryption(&ivk, &output, zip212)
# which is what audit.rs uses.
sapling-crypto = { version = "0.9", default-features = false, features = ["std"], optional = true }
zcash_note_encryption = { version = "0.5.1", default-features = false, features = ["alloc"], optional = true }

[features]
default = []
sapling = ["dep:sapling-crypto", "dep:zcash_note_encryption"]

[dev-dependencies]
sapling-crypto = { version = "0.9", default-features = false, features = ["std"] }
zcash_note_encryption = { version = "0.5.1", default-features = false, features = ["alloc"] }
rand = "0.10"

# --- reading a real mined transaction (tests/chain_probe.rs) --------------
# Pinned to the same Sapling stack the crate itself uses: zcash_primitives 0.31
# and zcash_keys 0.17 both depend on sapling-crypto ^0.9, so the output type
# parsed here is the same type the auditor decrypts. Bumping either without
# bumping the others would make the test fail to compile rather than silently
# proving something about a different library.
#
# `circuits` is left off deliberately: the auditor never builds a proof, and
# enabling proving pulls in the parameter-loading machinery for no benefit.
zcash_primitives = { version = "0.31", default-features = false, features = ["std"] }
zcash_keys = { version = "0.17", default-features = false, features = ["sapling", "std"] }
zcash_protocol = { version = "0.11", default-features = false, features = ["std"] }
