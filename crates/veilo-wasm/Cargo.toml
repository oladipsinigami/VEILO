[package]
name = "veilo-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Browser auditor for Veilo (wasm32-unknown-unknown)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
veilo-core = { workspace = true }
wasm-bindgen = "0.2"

[features]
default = []
# The browser auditor needs real Sapling decryption, so the wasm bundle carries
# sapling-crypto. It is a separate feature rather than default because the
# non-sapling build of this crate is useful on its own (memo size, layout
# checks) and stays far smaller.
sapling = ["veilo-core/sapling"]

[dev-dependencies]
# The exported logic is plain Rust, so it is unit-tested natively rather than
# under wasm-bindgen-test. See the note in src/lib.rs.
sapling-crypto = { version = "0.9", default-features = false, features = ["std"] }
zcash_note_encryption = { version = "0.5.1", default-features = false, features = ["alloc"] }
rand = "0.10"
